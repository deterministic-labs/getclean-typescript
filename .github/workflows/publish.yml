name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  # The version package.json names under packageManager.
  PNPM_VERSION: 10.33.0

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"
      - name: Refuse to publish from a private repository
        # The release environment's required review is enforced on public repositories; a tag pushed while the
        # repository is still private would publish with no review.
        run: test "${{ github.event.repository.private }}" = "false" || { echo "the repository is private; publish only from the public repository"; exit 1; }
      - name: Check that the tag names the version being built
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "the tag $GITHUB_REF_NAME does not name the package version $version"; exit 1; }
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v }
            on && !/^## / { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Install, lint, build and test
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          pnpm exec tsc --noEmit -p tests/tsconfig.json
          pnpm run test --run
      - name: Load the built package as a user does
        run: |
          cd "$(mktemp -d)"
          node --input-type=module -e "import('$GITHUB_WORKSPACE/dist/esm/index.mjs').then((m) => { if (typeof m.GetClean !== 'function') { console.error('the ES module build exports no GetClean class'); process.exit(1); } }, (error) => { console.error('the ES module build does not load: ' + error.message); process.exit(1); })"
          node -e "const m = require('$GITHUB_WORKSPACE/dist/cjs/index.js'); if (typeof m.GetClean !== 'function') { console.error('the CommonJS build exports no GetClean class'); process.exit(1); }"
      - name: Pack the package exactly as it will be published
        run: |
          mkdir -p package
          npm pack --pack-destination package
          ls package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            package/
            notes.md
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/getclean
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that npm can use trusted publishing
        # Trusted publishing needs npm 11.5.1 or later; Node 24 bundles it from 24.5.0 on.
        run: |
          node -e "const [a, b, c] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error('npm ' + [a, b, c].join('.') + ' is older than 11.5.1'); process.exit(1); }"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Trusted publishing: the job's OIDC token authenticates the publish and npm writes the provenance itself; no
      # token is stored and no flag is needed. The package is unscoped, so it is public. This job installs nothing and
      # builds nothing: it publishes the packed file the build job made.
      - name: Publish
        run: npm publish package/*.tgz

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
